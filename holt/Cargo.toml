[package]
name = "holt"
version = "0.1.0"
edition = "2024"

[dependencies]
compiler = { path = "../compiler" }
hls = { path = "../hls" }
clap = { version = "4", features = ["derive"] }
anstyle = "1"
miette = { version = "7", features = ["fancy"] }
console = "0.16"
indicatif = "0.17"
inkwell = { version = "0.10", features = ["llvm21-1"] }
