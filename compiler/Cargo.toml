[package]
name = "holt-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]
inkwell = { version = "0.10", features = ["llvm21-1"] }
logos = "0.16.1"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }

[lib]
name = "compiler"
path = "src/lib.rs"
